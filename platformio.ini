; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = TSynth

[env:teensy41]
platform = teensy
board = teensy41
; seeing a beep issue sometimes which goes away with teensyduino 1.154.0-beta7+sha.ab262c6
;platform_packages =
;    framework-arduinoteensy@https://github.com/maxgerhardt/teensy-core-pio-package.git
framework = arduino
; AUDIO_BLOCK_SAMPLES=64 halves the audio block (128 is the Audio library default):
; notes start up to ~1.5ms after they arrive instead of ~2.9ms, for a little more CPU.
; It must apply to the Teensy core and all libraries, so it is set here. (In the Arduino IDE
; it has to be changed in the Teensy core's AudioStream.h.) Remove it to go back to 128.
build_flags = -D USB_MIDI_AUDIO_SERIAL -D AUDIO_BLOCK_SAMPLES=64
lib_deps = 
	rlogiacco/CircularBuffer@^1.3.3
	adafruit/Adafruit GFX Library@^1.10.7
	ftrias/TeensyThreads@^1.0.1
	adafruit/Adafruit BusIO@^1.7.3
